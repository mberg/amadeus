<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amadeus Dashboard</title>
</head>
<body>
  <div class="header">
    <h1>Amadeus</h1>
    <p class="subtitle">Agent Orchestration Dashboard</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="total-agents">0</div>
      <div class="stat-label">Total Agents</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="working-agents">0</div>
      <div class="stat-label">Working</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="idle-agents">0</div>
      <div class="stat-label">Idle</div>
    </div>
  </div>

  <div class="agents-grid" id="agents-grid">
    <div class="empty-state">
      <div class="icon">🎼</div>
      <h2>No active agents</h2>
      <p>Agents will appear here when Linear issues trigger them</p>
    </div>
  </div>

  <div class="last-updated">
    <span class="refresh-indicator"></span>
    Last updated: <span id="last-updated">-</span>
  </div>

  <!-- Console Panel Overlay -->
  <div class="console-overlay" id="console-overlay"></div>

  <!-- Console Panel -->
  <div class="console-panel" id="console-panel">
    <div class="console-header">
      <div class="console-title">
        Messages <span class="agent-badge" id="console-agent-id">-</span>
      </div>
      <button class="console-close" id="console-close">&times;</button>
    </div>
    <div class="console-body" id="console-body">
      <div class="console-empty">Select an agent to view messages</div>
    </div>
  </div>

  <script type="module" src="./dashboard.ts"></script>
</body>
</html>
