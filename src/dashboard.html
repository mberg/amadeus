<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amadeus Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e4e4e7;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      color: #71717a;
      font-size: 0.9rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem 2rem;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: #a78bfa;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .agents-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 1.5rem;
      max-width: 1400px;
      margin: 0 auto;
    }

    .agent-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .agent-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(167, 139, 250, 0.3);
      transform: translateY(-2px);
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .agent-identifier {
      font-size: 1.25rem;
      font-weight: 600;
      color: #f4f4f5;
    }

    .agent-identifier a {
      color: inherit;
      text-decoration: none;
    }

    .agent-identifier a:hover {
      color: #a78bfa;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-idle {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status-idle .dot {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-starting {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
    }

    .status-starting .dot {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-working {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .status-working .dot {
      background: #60a5fa;
      box-shadow: 0 0 8px #60a5fa;
      animation: pulse 1s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .agent-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .detail {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .detail-label {
      font-size: 0.7rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-size: 0.95rem;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      color: #d4d4d8;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #71717a;
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #a1a1aa;
    }

    .last-updated {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #52525b;
    }

    .refresh-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 0.5rem;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Amadeus</h1>
    <p class="subtitle">Agent Orchestration Dashboard</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="total-agents">0</div>
      <div class="stat-label">Total Agents</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="working-agents">0</div>
      <div class="stat-label">Working</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="idle-agents">0</div>
      <div class="stat-label">Idle</div>
    </div>
  </div>

  <div class="agents-grid" id="agents-grid">
    <div class="empty-state">
      <div class="icon">🎼</div>
      <h2>No active agents</h2>
      <p>Agents will appear here when Linear issues trigger them</p>
    </div>
  </div>

  <div class="last-updated">
    <span class="refresh-indicator"></span>
    Last updated: <span id="last-updated">-</span>
  </div>

  <script>
    function formatUptime(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (days > 0) {
        return `${days}d ${hours % 24}h ${minutes % 60}m`;
      } else if (hours > 0) {
        return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
      } else if (minutes > 0) {
        return `${minutes}m ${seconds % 60}s`;
      } else {
        return `${seconds}s`;
      }
    }

    function getLinearUrl(identifier) {
      const teamKey = identifier.split('-')[0].toLowerCase();
      return `https://linear.app/team-${teamKey}/issue/${identifier}`;
    }

    function renderAgents(agents) {
      const grid = document.getElementById('agents-grid');
      const totalEl = document.getElementById('total-agents');
      const workingEl = document.getElementById('working-agents');
      const idleEl = document.getElementById('idle-agents');

      totalEl.textContent = agents.length;
      workingEl.textContent = agents.filter(a => a.status === 'working').length;
      idleEl.textContent = agents.filter(a => a.status === 'idle').length;

      if (agents.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎼</div>
            <h2>No active agents</h2>
            <p>Agents will appear here when Linear issues trigger them</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = agents.map(agent => `
        <div class="agent-card">
          <div class="agent-header">
            <div class="agent-identifier">
              <a href="${getLinearUrl(agent.issueIdentifier)}" target="_blank" rel="noopener">
                ${agent.issueIdentifier}
              </a>
            </div>
            <div class="status-badge status-${agent.status}">
              <span class="dot"></span>
              ${agent.status}
            </div>
          </div>
          <div class="agent-details">
            <div class="detail">
              <div class="detail-label">Port</div>
              <div class="detail-value">${agent.port}</div>
            </div>
            <div class="detail">
              <div class="detail-label">Uptime</div>
              <div class="detail-value">${formatUptime(agent.uptime)}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function fetchStatus() {
      try {
        const response = await fetch('/status');
        const data = await response.json();
        renderAgents(data.agents);
        document.getElementById('last-updated').textContent =
          new Date(data.timestamp).toLocaleTimeString();
      } catch (error) {
        console.error('Failed to fetch status:', error);
      }
    }

    // Initial fetch
    fetchStatus();

    // Refresh every 2 seconds
    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
