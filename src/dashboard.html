<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Amadeus Dashboard</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, sans-serif;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
      min-height: 100vh;
      color: #e4e4e7;
      padding: 2rem;
    }

    .header {
      text-align: center;
      margin-bottom: 2rem;
    }

    .header h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 0.1em;
      margin-bottom: 0.5rem;
      background: linear-gradient(90deg, #a78bfa, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .header .subtitle {
      color: #71717a;
      font-size: 0.9rem;
    }

    .stats-bar {
      display: flex;
      justify-content: center;
      gap: 2rem;
      margin-bottom: 2rem;
      flex-wrap: wrap;
    }

    .stat {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 1rem 2rem;
      text-align: center;
    }

    .stat-value {
      font-size: 2rem;
      font-weight: 600;
      color: #a78bfa;
    }

    .stat-label {
      font-size: 0.8rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .agents-grid {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      max-width: 600px;
      margin: 0 auto;
    }

    .agent-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 16px;
      padding: 1.5rem;
      transition: all 0.3s ease;
    }

    .agent-card:hover {
      background: rgba(255, 255, 255, 0.06);
      border-color: rgba(167, 139, 250, 0.3);
      transform: translateY(-2px);
    }

    .agent-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .agent-identifier {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 1.25rem;
      font-weight: 600;
      color: #f4f4f5;
    }

    .agent-identifier a {
      color: inherit;
      text-decoration: none;
    }

    .agent-identifier a:hover {
      color: #a78bfa;
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.75rem;
      border-radius: 9999px;
      font-size: 0.75rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-badge .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }

    .status-idle {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .status-idle .dot {
      background: #4ade80;
      box-shadow: 0 0 8px #4ade80;
    }

    .status-starting {
      background: rgba(250, 204, 21, 0.15);
      color: #facc15;
    }

    .status-starting .dot {
      background: #facc15;
      box-shadow: 0 0 8px #facc15;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .status-working {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .status-working .dot {
      background: #60a5fa;
      box-shadow: 0 0 8px #60a5fa;
      animation: pulse 1s ease-in-out infinite;
    }

    .linear-state-badge {
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 0.03em;
      background: rgba(255, 255, 255, 0.1);
      color: #a1a1aa;
    }

    .linear-state-scoping {
      background: rgba(147, 51, 234, 0.2);
      color: #c084fc;
    }

    .linear-state-building {
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
    }

    .linear-state-feedback {
      background: rgba(245, 158, 11, 0.2);
      color: #fbbf24;
    }

    .linear-state-review {
      background: rgba(168, 85, 247, 0.2);
      color: #c084fc;
    }

    .linear-state-done {
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.5; transform: scale(0.8); }
    }

    .agent-details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.75rem;
    }

    .detail {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 8px;
      padding: 0.75rem;
    }

    .detail-label {
      font-size: 0.7rem;
      color: #71717a;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      margin-bottom: 0.25rem;
    }

    .detail-value {
      font-size: 0.95rem;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      color: #d4d4d8;
    }

    .empty-state {
      text-align: center;
      padding: 4rem 2rem;
      color: #71717a;
    }

    .empty-state .icon {
      font-size: 4rem;
      margin-bottom: 1rem;
      opacity: 0.5;
    }

    .empty-state h2 {
      font-size: 1.25rem;
      font-weight: 400;
      margin-bottom: 0.5rem;
      color: #a1a1aa;
    }

    .last-updated {
      text-align: center;
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #52525b;
    }

    .refresh-indicator {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #4ade80;
      margin-right: 0.5rem;
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 90%, 100% { opacity: 1; }
      95% { opacity: 0.3; }
    }

    .agent-card.clickable {
      cursor: pointer;
    }

    /* Console Panel */
    .console-panel {
      position: fixed;
      top: 0;
      right: -50%;
      width: 50%;
      height: 100vh;
      background: #0d1117;
      border-left: 1px solid rgba(255, 255, 255, 0.1);
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      z-index: 1000;
    }

    .console-panel.open {
      right: 0;
    }

    .console-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 1rem 1.5rem;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      background: rgba(255, 255, 255, 0.03);
    }

    .console-title {
      font-size: 1rem;
      font-weight: 600;
      color: #f4f4f5;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .console-title .agent-badge {
      background: rgba(167, 139, 250, 0.2);
      color: #a78bfa;
      padding: 0.25rem 0.5rem;
      border-radius: 4px;
      font-size: 0.85rem;
    }

    .console-close {
      background: none;
      border: none;
      color: #71717a;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0.25rem;
      line-height: 1;
    }

    .console-close:hover {
      color: #f4f4f5;
    }

    .console-body {
      flex: 1;
      overflow-y: auto;
      padding: 1rem;
      font-family: 'SF Mono', 'Monaco', 'Inconsolata', monospace;
      font-size: 0.85rem;
      line-height: 1.6;
    }

    .message {
      margin-bottom: 1rem;
      padding: 0.75rem;
      border-radius: 6px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message-user {
      background: rgba(59, 130, 246, 0.15);
      border-left: 3px solid #60a5fa;
    }

    .message-assistant {
      background: rgba(34, 197, 94, 0.1);
      border-left: 3px solid #4ade80;
    }

    .message-role {
      font-size: 0.7rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #71717a;
      margin-bottom: 0.5rem;
    }

    .message-content {
      color: #d4d4d8;
    }

    .console-empty {
      color: #52525b;
      text-align: center;
      padding: 2rem;
    }

    .console-loading {
      color: #71717a;
      text-align: center;
      padding: 2rem;
    }

    .console-error {
      color: #f87171;
      text-align: center;
      padding: 2rem;
    }

    /* Overlay for mobile */
    .console-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      z-index: 999;
    }

    .console-overlay.open {
      opacity: 1;
      visibility: visible;
    }

    @media (max-width: 768px) {
      .console-panel {
        width: 100%;
        right: -100%;
      }
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Amadeus</h1>
    <p class="subtitle">Agent Orchestration Dashboard</p>
  </div>

  <div class="stats-bar">
    <div class="stat">
      <div class="stat-value" id="total-agents">0</div>
      <div class="stat-label">Total Agents</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="working-agents">0</div>
      <div class="stat-label">Working</div>
    </div>
    <div class="stat">
      <div class="stat-value" id="idle-agents">0</div>
      <div class="stat-label">Idle</div>
    </div>
  </div>

  <div class="agents-grid" id="agents-grid">
    <div class="empty-state">
      <div class="icon">🎼</div>
      <h2>No active agents</h2>
      <p>Agents will appear here when Linear issues trigger them</p>
    </div>
  </div>

  <div class="last-updated">
    <span class="refresh-indicator"></span>
    Last updated: <span id="last-updated">-</span>
  </div>

  <!-- Console Panel Overlay -->
  <div class="console-overlay" id="console-overlay"></div>

  <!-- Console Panel -->
  <div class="console-panel" id="console-panel">
    <div class="console-header">
      <div class="console-title">
        Messages <span class="agent-badge" id="console-agent-id">-</span>
      </div>
      <button class="console-close" id="console-close">&times;</button>
    </div>
    <div class="console-body" id="console-body">
      <div class="console-empty">Select an agent to view messages</div>
    </div>
  </div>

  <script>
    // State for console panel
    let currentAgentKey = null;
    let messagesInterval = null;
    let agentsData = [];

    function formatUptime(ms) {
      const seconds = Math.floor(ms / 1000);
      const minutes = Math.floor(seconds / 60);
      const hours = Math.floor(minutes / 60);
      const days = Math.floor(hours / 24);

      if (days > 0) {
        return `${days}d ${hours % 24}h ${minutes % 60}m`;
      } else if (hours > 0) {
        return `${hours}h ${minutes % 60}m ${seconds % 60}s`;
      } else if (minutes > 0) {
        return `${minutes}m ${seconds % 60}s`;
      } else {
        return `${seconds}s`;
      }
    }

    function getLinearUrl(identifier) {
      const teamKey = identifier.split('-')[0].toLowerCase();
      return `https://linear.app/team-${teamKey}/issue/${identifier}`;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function getLinearStateClass(state) {
      if (!state) return '';
      const lower = state.toLowerCase();
      if (lower.includes('scoping')) return 'linear-state-scoping';
      if (lower.includes('building')) return 'linear-state-building';
      if (lower.includes('feedback')) return 'linear-state-feedback';
      if (lower.includes('review')) return 'linear-state-review';
      if (lower.includes('done')) return 'linear-state-done';
      return '';
    }

    function renderAgents(agents) {
      agentsData = agents;
      const grid = document.getElementById('agents-grid');
      const totalEl = document.getElementById('total-agents');
      const workingEl = document.getElementById('working-agents');
      const idleEl = document.getElementById('idle-agents');

      totalEl.textContent = agents.length;
      workingEl.textContent = agents.filter(a => a.status === 'working').length;
      idleEl.textContent = agents.filter(a => a.status === 'idle').length;

      if (agents.length === 0) {
        grid.innerHTML = `
          <div class="empty-state">
            <div class="icon">🎼</div>
            <h2>No active agents</h2>
            <p>Agents will appear here when Linear issues trigger them</p>
          </div>
        `;
        return;
      }

      grid.innerHTML = agents.map(agent => `
        <div class="agent-card clickable" data-agent-key="${escapeHtml(agent.key)}" onclick="openConsole('${escapeHtml(agent.key)}')">
          <div class="agent-header">
            <div class="agent-identifier">
              <a href="${getLinearUrl(agent.issueIdentifier)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
                ${agent.issueIdentifier}
              </a>
              ${agent.linearState ? `<span class="linear-state-badge ${getLinearStateClass(agent.linearState)}">${escapeHtml(agent.linearState)}</span>` : ''}
            </div>
            <div class="status-badge status-${agent.status}">
              <span class="dot"></span>
              ${agent.status}
            </div>
          </div>
          <div class="agent-details">
            <div class="detail">
              <div class="detail-label">Port</div>
              <div class="detail-value">${agent.port}</div>
            </div>
            <div class="detail">
              <div class="detail-label">Uptime</div>
              <div class="detail-value">${formatUptime(agent.uptime)}</div>
            </div>
          </div>
        </div>
      `).join('');
    }

    async function fetchStatus() {
      try {
        const response = await fetch('/status');
        const data = await response.json();
        renderAgents(data.agents);
        document.getElementById('last-updated').textContent =
          new Date(data.timestamp).toLocaleTimeString();
      } catch (error) {
        console.error('Failed to fetch status:', error);
      }
    }

    function renderMessages(messages) {
      const body = document.getElementById('console-body');

      if (!messages || messages.length === 0) {
        body.innerHTML = '<div class="console-empty">No messages yet</div>';
        return;
      }

      body.innerHTML = messages.map(msg => {
        const role = msg.role || 'unknown';
        const content = msg.content || '';
        return `
          <div class="message message-${role}">
            <div class="message-role">${role}</div>
            <div class="message-content">${escapeHtml(content)}</div>
          </div>
        `;
      }).join('');

      // Auto-scroll to bottom
      body.scrollTop = body.scrollHeight;
    }

    async function fetchMessages(agentKey) {
      const body = document.getElementById('console-body');

      try {
        const response = await fetch(`/agents/${encodeURIComponent(agentKey)}/messages`);
        if (!response.ok) {
          if (response.status === 404) {
            body.innerHTML = '<div class="console-error">Agent not found</div>';
            return;
          }
          throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        renderMessages(data.messages || []);
      } catch (error) {
        console.error('Failed to fetch messages:', error);
        body.innerHTML = '<div class="console-error">Failed to load messages</div>';
      }
    }

    function openConsole(agentKey) {
      const agent = agentsData.find(a => a.key === agentKey);
      if (!agent) return;

      currentAgentKey = agentKey;

      // Update header
      document.getElementById('console-agent-id').textContent = agent.issueIdentifier;

      // Show loading state
      document.getElementById('console-body').innerHTML = '<div class="console-loading">Loading messages...</div>';

      // Open panel
      document.getElementById('console-panel').classList.add('open');
      document.getElementById('console-overlay').classList.add('open');

      // Fetch messages immediately
      fetchMessages(agentKey);

      // Start polling for updates
      if (messagesInterval) clearInterval(messagesInterval);
      messagesInterval = setInterval(() => fetchMessages(agentKey), 1500);
    }

    function closeConsole() {
      currentAgentKey = null;

      // Stop polling
      if (messagesInterval) {
        clearInterval(messagesInterval);
        messagesInterval = null;
      }

      // Close panel
      document.getElementById('console-panel').classList.remove('open');
      document.getElementById('console-overlay').classList.remove('open');
    }

    // Event listeners for closing
    document.getElementById('console-close').addEventListener('click', closeConsole);
    document.getElementById('console-overlay').addEventListener('click', closeConsole);

    // Close on Escape key
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && currentAgentKey) {
        closeConsole();
      }
    });

    // Initial fetch
    fetchStatus();

    // Refresh every 2 seconds
    setInterval(fetchStatus, 2000);
  </script>
</body>
</html>
